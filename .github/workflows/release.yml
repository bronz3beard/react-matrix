name: Release

# Publishing a GitHub Release stages the package on npm through trusted publishing (OIDC, no npm token), with
# provenance. Nothing is installable until a maintainer approves the staged version with 2FA (`npm stage approve` or
# npmjs.com). A release marked "pre-release" goes to the `next` dist-tag; a full release goes to `latest`.
# One-time setup on npmjs.com: package settings → Trusted Publisher → GitHub Actions, user `bronz3beard`,
# repository `react-matrix`, workflow `release.yml`, "Allow npm publish" unticked (staged publishing only).
# Without it, the stage step fails and nothing is staged.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The same checks a push runs, against the commit being released: lint, types,
  # unit tests, both React majors, the e2e suite and the package gates.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint the OIDC token npm exchanges for publish rights.
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `registry-url` is not decoration: it writes the .npmrc that npm's OIDC
      # exchange reads. Without it npm never tries trusted publishing and fails
      # with ENEEDAUTH. Node 26 is pinned because staged publishing needs
      # `npm stage`, which npm 11.11 (bundled with Node 24) does not have.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check the release matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG doesn't match package.json version $version (expected v$version)."
            exit 1
          fi
          case "$version" in
            *-*)
              if [ "$PRERELEASE" != "true" ]; then
                echo "::error::$version is a prerelease version: mark the GitHub Release as a pre-release so it goes to the next tag."
                exit 1
              fi
              ;;
          esac

      - name: Check npm supports staged publishing
        run: |
          if ! npm stage --help > /dev/null 2>&1; then
            echo "::error::npm $(npm --version) has no 'npm stage' command, which staged publishing needs."
            exit 1
          fi

      - run: npm ci

      # `npm stage publish` runs prepublishOnly (the build) like `npm publish`, then uploads the package for approval
      # instead of publishing it. Provenance is automatic for a public package staged from a public repository.
      - run: npm stage publish --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}

      - name: What happens next
        run: |
          echo "### Staged for approval" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing is installable yet. Approve or reject it at" >> "$GITHUB_STEP_SUMMARY"
          echo "<https://www.npmjs.com/package/react-data-matrix/access>," >> "$GITHUB_STEP_SUMMARY"
          echo 'or with `npm stage list react-data-matrix` then `npm stage approve <stage-id>`.' >> "$GITHUB_STEP_SUMMARY"
