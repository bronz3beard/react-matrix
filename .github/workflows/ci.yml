name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 19 = current; 18 = the declared peer floor (^18.3.0).
        react: ['19', '18']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Use the React 18.3 peer floor
        if: matrix.react == '18'
        run: npm install --no-save react@18.3 react-dom@18.3 @types/react@18 @types/react-dom@18
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:site
      - name: Package purity, publint and attw
        if: matrix.react == '19'
        run: npm run check:package

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    # Same pinned image as scripts/e2e-docker.sh, so screenshots match local runs.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run test:e2e
        env:
          # GitHub sets HOME=/github/home (owned by another user) in container jobs;
          # Firefox refuses to run as root there. Playwright's documented workaround.
          HOME: /root
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
